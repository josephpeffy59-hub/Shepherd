<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>Admin — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="shepherd.css" th:href="@{/css/shepherd.css}"/>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <span class="navbar-brand text-white fw-bold">Shepherd — Admin</span>
    <form action="/logout" th:action="@{/logout}" method="post">
      <button class="btn btn-light btn-sm fw-bold" style="color:var(--sky);">Logout</button>
    </form>
  </nav>
  <div class="container mt-4 mb-5">
    <h1>Community overview</h1><p class="text-muted mb-4">Manage quarter guidance and review your platform totals.</p>
    <div class="row mb-4">
      <div class="col-md-3 mb-2"><div class="card p-3 text-center"><b>Users</b><div class="fs-3" th:text="${users.size()}"></div></div></div>
      <div class="col-md-3 mb-2"><div class="card p-3 text-center"><b>Authorities</b><div class="fs-3" th:text="${authorities.size()}"></div></div></div>
      <div class="col-md-3 mb-2"><div class="card p-3 text-center"><b>Alerts</b><div class="fs-3" th:text="${alerts.size()}"></div></div></div>
      <div class="col-md-3 mb-2"><div class="card p-3 text-center"><b>Quarters</b><div class="fs-3" th:text="${quarters.size()}"></div></div></div>
    </div>

    <h5 style="color:var(--sky);">Update Quarter Safety</h5>
    <div class="card p-0 table-responsive">
      <table class="table mb-0">
        <thead class="table-light">
          <tr><th>Quarter</th><th>Rating</th><th>Description</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="q : ${quarters}">
            <td th:text="${q.name}" class="fw-semibold"></td>
            <td>
              <form method="post" th:id="${'quarter-form-' + q.id}" th:action="@{/admin/quarter/{id}(id=${q.id})}"></form>
                <select aria-label="Safety rating" th:attr="form=${'quarter-form-' + q.id}" name="rating" class="form-select form-select-sm">
                  <option th:each="r : ${T(com.crowdguard.model.SafetyRating).values()}"
                          th:value="${r}" th:text="${r}"
                          th:selected="${r == q.safetyRating}"></option>
                </select>
            </td>
            <td><input aria-label="Quarter description" th:attr="form=${'quarter-form-' + q.id}" name="description" class="form-control form-control-sm" th:value="${q.description}"/></td>
            <td><button th:attr="form=${'quarter-form-' + q.id}" class="btn btn-sm btn-shepherd">Save</button></td>

          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="shepherd.js" th:src="@{/js/shepherd.js}" defer></script>
</body>
</html>
