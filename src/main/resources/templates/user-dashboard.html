<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
  <style> #map { height: 400px; } </style>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <span class="navbar-brand text-white fw-bold">Shepherd — Citizen</span>
    <div>
      <a href="/quarters" class="btn btn-outline-light btn-sm me-2">Quarter Safety</a>
      <a href="/family" class="btn btn-outline-light btn-sm me-2">Family</a>
      <form action="/logout" method="post" class="d-inline">
        <button class="btn btn-light btn-sm fw-bold" style="color:var(--sky);">Logout</button>
      </form>
    </div>
  </nav>

  <div id="soundBanner" class="alert mb-0 text-center" style="background:var(--sky-light); color:var(--ink);">
    🔔 <a href="#" id="enableSound" style="color:var(--sky); font-weight:700;">Click here to enable sound alerts</a> for family emergencies.
  </div>

  <div class="container text-center mt-4">
    <h3>Hello, <span th:text="${userName}" style="color:var(--sky);">user</span></h3>
    <p class="text-muted">In case of emergency, press the button below.</p>
    <button id="distressBtn" class="mt-2">TRIGGER ALERT</button>
    <div id="status" class="mt-3 fw-bold" style="color:var(--sky);"></div>
  </div>

  <div class="container mt-4 mb-5" style="max-width:800px;">
    <div id="map"></div>
    <div id="familyAlerts" class="mt-3"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script th:inline="javascript">
    const MY_USER_ID = /*[[${userId}]]*/ '';
    const MY_FAMILY_ID = /*[[${familyId}]]*/ '';

    const map = L.map('map').setView([3.8480, 11.5021], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let myMarker = null;

    let audioCtx = null;
    function primeAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.getElementById('enableSound').addEventListener('click', e => {
      e.preventDefault();
      primeAudio();
      const b = document.getElementById('soundBanner');
      b.classList.remove('alert');
      b.classList.add('alert-success');
      b.innerHTML = '✅ Sound alerts enabled.';
    });

    function playAlertSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [
        { f: 880, t: 0.00 }, { f: 660, t: 0.25 },
        { f: 880, t: 0.50 }, { f: 660, t: 0.75 },
        { f: 880, t: 1.00 }, { f: 660, t: 1.25 }
      ];
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0.35, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + 0.22);
      });
      if (navigator.vibrate) navigator.vibrate([400,150,400,150,400]);
    }

    const btn = document.getElementById('distressBtn');
    const status = document.getElementById('status');
    let active = false;

    btn.addEventListener('click', () => {
      primeAudio();
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (myMarker) map.removeLayer(myMarker);
        myMarker = L.marker([latitude, longitude]).addTo(map)
          .bindPopup('Your location').openPopup();
        map.setView([latitude, longitude], 15);

        const url = active ? '/api/alert/cancel' : '/api/alert/trigger';
        const payload = active ? {} : { latitude, longitude };

        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(r => {
          if (!r.ok) throw new Error('Failed');
          active = !active;
          btn.textContent = active ? 'CANCEL ALERT' : 'TRIGGER ALERT';
          btn.classList.toggle('active', active);
          status.textContent = active
            ? '🚨 Alert sent to authorities and family.'
            : 'Alert cancelled.';
        });
      }, () => alert('Enable location services to use Shepherd.'));
    });

    if (MY_FAMILY_ID && MY_FAMILY_ID !== '') {
      const socket = new SockJS('/ws');
      const stomp = Stomp.over(socket);
      stomp.debug = null;
      stomp.connect({}, () => {
        stomp.subscribe('/topic/family/' + MY_FAMILY_ID, msg => {
          const a = JSON.parse(msg.body);
          if (a.userId === MY_USER_ID) return;
          if (a.cancel) {
            document.getElementById('familyAlerts').innerHTML = '';
            return;
          }
          playAlertSound();
          document.getElementById('familyAlerts').innerHTML =
            `<div class="alert alert-danger">
               🚨 <b>${a.userName}</b> (family) triggered an alert in
               <b>${a.quarter}</b> at ${new Date().toLocaleTimeString()}.
               <br><small>Location: ${a.lat.toFixed(5)}, ${a.lng.toFixed(5)}</small>
             </div>`;
          const marker = L.marker([a.lat, a.lng]).addTo(map);
          marker.bindPopup(`<b>Family alert: ${a.userName}</b>`).openPopup();
          map.setView([a.lat, a.lng], 15);
        });
      });
    }
  </script>
</body>
</html>
