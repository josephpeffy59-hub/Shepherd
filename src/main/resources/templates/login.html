<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#173f35"/>
  <title>Login — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="shepherd.css" th:href="@{/css/shepherd.css}"/>
</head>
<body class="auth-page">
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="index.html" th:href="@{/}">Shepherd</a>
    <a class="btn btn-outline-light btn-sm" href="quarters.html" th:href="@{/quarters}">Explore quarter safety</a>
  </nav>
  <div class="container mt-5" style="max-width:420px;">
    <div class="card p-4 auth-card">
      <p class="eyebrow">ACCOUNT ACCESS</p><h1 class="auth-title">Welcome back.</h1><p class="text-muted mb-4">Sign in to access your community safety account.</p>
      <div th:if="${param.registered}" class="alert alert-success">Registered! Please log in.</div>
      <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
      <form method="post" action="/login" th:action="@{/login}">
        <label class="form-label" for="field-username">Email</label>
        <input autocomplete="email" type="email" name="username" class="form-control mb-2" placeholder="Email" required id="field-username"/>
        <label class="form-label" for="field-password">Password</label>
        <input autocomplete="current-password" name="password" type="password" class="form-control mb-3" placeholder="Password" required id="field-password"/>
        <button class="btn btn-shepherd w-100">Sign in</button>
      </form>
      <a href="register.html" th:href="@{/register}" class="d-block mt-3 text-center" style="color:var(--sky);">Create account</a>
    </div>
  </div>
  <script src="shepherd.js" th:src="@{/js/shepherd.js}" defer></script>
</body>
</html>
