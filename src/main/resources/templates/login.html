<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="/">Shepherd</a>
  </nav>
  <div class="container mt-5" style="max-width:420px;">
    <div class="card p-4">
      <h4 class="mb-3" style="color:var(--sky);">Login</h4>
      <div th:if="${param.registered}" class="alert alert-success">Registered! Please log in.</div>
      <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
      <form method="post" action="/login">
        <input name="username" class="form-control mb-2" placeholder="Email" required/>
        <input name="password" type="password" class="form-control mb-3" placeholder="Password" required/>
        <button class="btn btn-shepherd w-100">Login</button>
      </form>
      <a href="/register" class="d-block mt-3 text-center" style="color:var(--sky);">Create account</a>
    </div>
  </div>
</body>
</html>
