<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#173f35"/>
  <title>Register — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="shepherd.css" th:href="@{/css/shepherd.css}"/>
</head>
<body class="auth-page">
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="index.html" th:href="@{/}">Shepherd</a>
    <a class="btn btn-outline-light btn-sm" href="authority-register.html" th:href="@{/authority-register}">Authority registration</a>
  </nav>
  <div class="container mt-4 mb-5" style="max-width:600px;">
    <div class="card p-4 auth-card">
      <p class="eyebrow">CITIZEN ACCOUNT</p><h1 class="auth-title">Your community starts here.</h1><p class="text-muted mb-4">Create your citizen account to send alerts and connect your household.</p>
      <form method="post" action="/register" th:action="@{/register}" enctype="multipart/form-data">
        <label class="form-label" for="field-fullName">Full Name</label>
        <input name="fullName" class="form-control mb-2" placeholder="Full Name" required id="field-fullName"/>
        <label class="form-label" for="field-email">Email</label>
        <input autocomplete="email" name="email" type="email" class="form-control mb-2" placeholder="Email" required id="field-email"/>
        <label class="form-label" for="field-password">Password</label>
        <input autocomplete="new-password" name="password" type="password" class="form-control mb-2" placeholder="Password" required id="field-password"/>

        <label class="form-label" for="field-quarterId">Your quarter</label>
        <select name="quarterId" class="form-select mb-2" required id="field-quarterId">
          <option value="">Select your quarter</option>
          <option th:each="q : ${quarters}" th:value="${q.id}"
                  th:text="${q.name + ' — ' + q.municipality}"></option>
        </select>

        <label class="form-label mt-2">ID Picture 1</label>
        <input type="file" name="idPicture1" accept="image/*" class="form-control mb-2" required/>
        <label class="form-label">ID Picture 2</label>
        <input type="file" name="idPicture2" accept="image/*" class="form-control mb-3" required/>

        <label class="form-label" for="field-inviteCode">Family invite code (optional)</label>
        <input name="inviteCode" class="form-control mb-3" placeholder="Family invite code (optional)" id="field-inviteCode"/>
        <button class="btn btn-shepherd w-100">Create citizen account</button>
      </form><p class="auth-switch">Already have an account? <a href="login.html" th:href="@{/login}">Sign in</a></p>
    </div>
  </div>
  <script src="shepherd.js" th:src="@{/js/shepherd.js}" defer></script>
</body>
</html>
