<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="/">Shepherd</a>
  </nav>
  <div class="container mt-4 mb-5" style="max-width:600px;">
    <div class="card p-4">
      <h4 class="mb-3" style="color:var(--sky);">Citizen Registration</h4>
      <form method="post" action="/register" enctype="multipart/form-data">
        <input name="fullName" class="form-control mb-2" placeholder="Full Name" required/>
        <input name="email" type="email" class="form-control mb-2" placeholder="Email" required/>
        <input name="password" type="password" class="form-control mb-2" placeholder="Password" required/>

        <select name="quarterId" class="form-select mb-2" required>
          <option value="">Select your quarter</option>
          <option th:each="q : ${quarters}" th:value="${q.id}"
                  th:text="${q.name + ' — ' + q.municipality}"></option>
        </select>

        <label class="form-label mt-2">ID Picture 1</label>
        <input type="file" name="idPicture1" accept="image/*" class="form-control mb-2" required/>
        <label class="form-label">ID Picture 2</label>
        <input type="file" name="idPicture2" accept="image/*" class="form-control mb-3" required/>

        <input name="inviteCode" class="form-control mb-3" placeholder="Family invite code (optional)"/>
        <button class="btn btn-shepherd w-100">Register</button>
      </form>
    </div>
  </div>
</body>
</html>
