<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Authority Registration — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="/">Shepherd</a>
  </nav>
  <div class="container mt-4 mb-5" style="max-width:600px;">
    <div class="card p-4">
      <h4 class="mb-3" style="color:var(--sky);">Authority Registration</h4>
      <form method="post" action="/authority-register">
        <input name="fullName" class="form-control mb-2" placeholder="Full Name" required/>
        <input name="email" type="email" class="form-control mb-2" placeholder="Email" required/>
        <input name="password" type="password" class="form-control mb-2" placeholder="Password" required/>
        <input name="badgeNumber" class="form-control mb-2" placeholder="Badge Number" required/>

        <select name="type" class="form-select mb-2" required>
          <option value="POLICE">Police</option>
          <option value="GENDARMERIE">Gendarmerie</option>
        </select>

        <select name="quarterId" class="form-select mb-3" required>
          <option value="">Jurisdiction quarter</option>
          <option th:each="q : ${quarters}" th:value="${q.id}"
                  th:text="${q.name + ' — ' + q.municipality}"></option>
        </select>

        <button class="btn btn-shepherd w-100">Register Authority</button>
      </form>
    </div>
  </div>
</body>
</html>
