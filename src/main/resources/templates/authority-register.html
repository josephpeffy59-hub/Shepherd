<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#173f35"/>
  <title>Authority Registration — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="shepherd.css" th:href="@{/css/shepherd.css}"/>
</head>
<body class="auth-page">
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="index.html" th:href="@{/}">Shepherd</a>
    <a class="btn btn-outline-light btn-sm" href="register.html" th:href="@{/register}">Citizen registration</a>
  </nav>
  <div class="container mt-4 mb-5" style="max-width:600px;">
    <div class="card p-4 auth-card">
      <p class="eyebrow">AUTHORITY ACCOUNT</p><h1 class="auth-title">A closer connection to your community.</h1><p class="text-muted mb-4">Register your service details and the quarter you serve.</p>
      <form method="post" action="/authority-register" th:action="@{/authority-register}">
        <label class="form-label" for="field-fullName">Full Name</label>
        <input name="fullName" class="form-control mb-2" placeholder="Full Name" required id="field-fullName"/>
        <label class="form-label" for="field-email">Email</label>
        <input autocomplete="email" name="email" type="email" class="form-control mb-2" placeholder="Email" required id="field-email"/>
        <label class="form-label" for="field-password">Password</label>
        <input autocomplete="new-password" name="password" type="password" class="form-control mb-2" placeholder="Password" required id="field-password"/>
        <label class="form-label" for="field-badgeNumber">Badge Number</label>
        <input name="badgeNumber" class="form-control mb-2" placeholder="Badge Number" required id="field-badgeNumber"/>

        <label class="form-label" for="field-type">Service</label>
        <select name="type" class="form-select mb-2" required id="field-type">
          <option value="POLICE">Police</option>
          <option value="GENDARMERIE">Gendarmerie</option>
        </select>

        <label class="form-label" for="field-quarterId">Jurisdiction quarter</label>
        <select name="quarterId" class="form-select mb-3" required id="field-quarterId">
          <option value="">Jurisdiction quarter</option>
          <option th:each="q : ${quarters}" th:value="${q.id}"
                  th:text="${q.name + ' — ' + q.municipality}"></option>
        </select>

        <button class="btn btn-shepherd w-100">Register Authority</button>
      </form><p class="auth-switch">Already have an account? <a href="login.html" th:href="@{/login}">Sign in</a></p>
    </div>
  </div>
  <script src="shepherd.js" th:src="@{/js/shepherd.js}" defer></script>
</body>
</html>
