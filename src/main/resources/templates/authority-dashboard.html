<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Authority Dashboard — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
  <style> #map { height: 500px; } </style>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <span class="navbar-brand text-white fw-bold">Shepherd — Authority</span>
    <div>
      <span class="text-white me-3" th:text="${authority.fullName}">Officer</span>
      <form action="/logout" method="post" class="d-inline">
        <button class="btn btn-light btn-sm fw-bold" style="color:var(--sky);">Logout</button>
      </form>
    </div>
  </nav>

  <div id="soundBanner" class="alert mb-0 text-center" style="background:var(--sky-light); color:var(--ink);">
    🔔 <a href="#" id="enableSound" style="color:var(--sky); font-weight:700;">Click here to enable sound alerts</a>.
    Keep this tab open — you will be notified instantly when a citizen in your quarter triggers an alert.
  </div>

  <div class="container mt-4">
    <h5>Jurisdiction: <span th:text="${authority.quarter.name}" style="color:var(--sky);">Bastos</span></h5>

    <div class="row">
      <div class="col-md-8"><div id="map"></div></div>
      <div class="col-md-4">
        <h6 class="mt-3 mt-md-0">Live Alerts</h6>
        <ul id="alerts" class="list-group"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script th:inline="javascript">
    const myQuarterId = /*[[${authority.quarter.id}]]*/ '';

    const map = L.map('map').setView([3.8480, 11.5021], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let audioCtx = null;
    function primeAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.getElementById('enableSound').addEventListener('click', e => {
      e.preventDefault();
      primeAudio();
      const b = document.getElementById('soundBanner');
      b.classList.remove('alert');
      b.classList.add('alert-success');
      b.innerHTML = '✅ Sound alerts enabled. Awaiting incoming alerts.';
    });

    function playAlertSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [
        { f: 880, t: 0.00 }, { f: 660, t: 0.25 },
        { f: 880, t: 0.50 }, { f: 660, t: 0.75 },
        { f: 880, t: 1.00 }, { f: 660, t: 1.25 }
      ];
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0.4, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + 0.22);
      });
      if (navigator.vibrate) navigator.vibrate([400,150,400,150,400]);
    }

    const alertsList = document.getElementById('alerts');
    const socket = new SockJS('/ws');
    const stomp = Stomp.over(socket);
    stomp.debug = null;

    stomp.connect({}, () => {
      stomp.subscribe('/topic/alerts', msg => {
        const a = JSON.parse(msg.body);
        if (a.quarterId !== myQuarterId) return;

        playAlertSound();

        const marker = L.marker([a.lat, a.lng]).addTo(map);
        marker.bindPopup(
          `<b>${a.userName}</b><br>${a.quarter}<br>
           <a href="/uploads/${a.idPicture1}" target="_blank">ID 1</a> |
           <a href="/uploads/${a.idPicture2}" target="_blank">ID 2</a>`
        ).openPopup();
        map.setView([a.lat, a.lng], 15);

        const li = document.createElement('li');
        li.className = 'list-group-item list-group-item-danger';
        li.innerHTML = `<b>${a.userName}</b> — ${a.quarter}
          <br><small>${new Date().toLocaleTimeString()}</small>
          <br><a href="/uploads/${a.idPicture1}" target="_blank">View ID 1</a>
          | <a href="/uploads/${a.idPicture2}" target="_blank">View ID 2</a>`;
        alertsList.prepend(li);
      });
    });
  </script>
</body>
</html>
