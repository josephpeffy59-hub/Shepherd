<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Quarter Safety — Shepherd</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shepherd.css"/>
</head>
<body>
  <nav class="navbar navbar-shepherd px-3">
    <a class="navbar-brand text-white fw-bold" href="/">Shepherd</a>
  </nav>
  <div class="container mt-4 mb-5">
    <h3 style="color:var(--sky);">Quarter Safety Guide — Yaoundé</h3>
    <p class="text-muted">Colour-coded safety ratings for every quarter in the city.</p>
    <div class="card p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>Quarter</th><th>Municipality</th><th>Rating</th><th>Notes</th></tr>
        </thead>
        <tbody>
          <tr th:each="q : ${quarters}">
            <td th:text="${q.name}" class="fw-semibold"></td>
            <td th:text="${q.municipality}"></td>
            <td>
              <span th:if="${q.safetyRating.name() == 'SAFE'}" class="badge-safe">SAFE</span>
              <span th:if="${q.safetyRating.name() == 'MODERATE'}" class="badge-moderate">MODERATE</span>
              <span th:if="${q.safetyRating.name() == 'DANGEROUS'}" class="badge-dangerous">DANGEROUS</span>
            </td>
            <td th:text="${q.description}" class="text-muted small"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
